name: Build ImmortalWrt for armsr_armv8

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Mode'
        required: true
        default: 'ImageBuilder'
        type: choice
        options:
          - ImageBuilder
          - Compile
      branch:
        description: 'ImmortalWrt Branch or Tag'
        required: true
        default: 'v25.12.2'
        type: choice
        options:
          - v24.10.6
          - v25.12.0
          - v25.12.1
          - v25.12.2
      kernel:
        description: 'Amlogic Kernel Version'
        required: true
        default: '6.12.y'
        type: choice
        options:
          - 6.12.y
          - 6.6.y
          - 6.1.y
      ssh:
        description: 'SSH connection to Actions'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: ${{ github.event.inputs.branch || 'v25.12.2' }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Free up space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update > /dev/null
        sudo -E apt-get -qq install -y $(curl -fsSL https://raw.githubusercontent.com/nantayo/My-Pkg/master/openwrt) > /dev/null
        sudo -E apt-get -qq autoremove --purge > /dev/null
        sudo -E apt-get -qq clean > /dev/null
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Prepare first-boot root password
      env:
        N1_ROOT_PASSWORD: ${{ secrets.N1_ROOT_PASSWORD }}
      run: |
        if [[ -z "$N1_ROOT_PASSWORD" ]]; then
          echo "Set the N1_ROOT_PASSWORD Actions secret before building."
          exit 1
        fi

        ROOT_PASSWORD_HASH=$(printf '%s\n' "$N1_ROOT_PASSWORD" | openssl passwd -6 -stdin)
        if [[ -z "$ROOT_PASSWORD_HASH" ]]; then
          echo "Failed to hash N1_ROOT_PASSWORD."
          exit 1
        fi

        mkdir -p armsr/armv8/N1/files/etc/uci-defaults
        printf '%s\n' "$ROOT_PASSWORD_HASH" > armsr/armv8/N1/files/etc/n1-root-password.hash
        chmod 600 armsr/armv8/N1/files/etc/n1-root-password.hash
        cat > armsr/armv8/N1/files/etc/uci-defaults/zzzz-n1-root-password <<'EOF'
        #!/bin/sh
        umask 077
        hash="$(cat /etc/n1-root-password.hash 2>/dev/null)"
        [ -n "$hash" ] || exit 1
        awk -F: -v hash="$hash" 'BEGIN { OFS = FS } $1 == "root" { $2 = hash } { print }' /etc/shadow > /etc/shadow.tmp || exit 1
        mv /etc/shadow.tmp /etc/shadow || exit 1
        rm -f /etc/n1-root-password.hash
        exit 0
        EOF
        chmod 700 armsr/armv8/N1/files/etc/uci-defaults/zzzz-n1-root-password

    - name: Use Image Builder to build rootfs
      if: github.event.inputs.build_mode != 'Compile'
      run: |
        VERSION_NUM=$(echo "${{ github.event.inputs.branch || 'v25.12.2' }}" | sed 's/^v//')
        IB_FILE="immortalwrt-imagebuilder-${VERSION_NUM}-armsr-armv8.Linux-x86_64.tar.zst"
        IB_URL="https://downloads.immortalwrt.org/releases/${VERSION_NUM}/targets/armsr/armv8/${IB_FILE}"
        
        echo "Downloading Image Builder from $IB_URL..."
        curl -LO "$IB_URL"
        tar -xf "$IB_FILE"
        rm -f "$IB_FILE"
        mv immortalwrt-imagebuilder-* imagebuilder
        
        cd imagebuilder
        mkdir -p packages files
        
        echo "Downloading custom packages..."
        if [[ "$VERSION_NUM" == 25.* ]]; then
          # APK mode (ImmortalWrt 25.12 and newer)
          AMLOGIC_URL=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/ophub/luci-app-amlogic/releases/latest | grep "browser_download_url" | grep "luci-app-amlogic" | grep -v "i18n" | grep "\.apk" | head -n 1 | cut -d '"' -f 4)
          if [ -n "$AMLOGIC_URL" ]; then curl -L -o packages/luci-app-amlogic.apk "$AMLOGIC_URL"; else echo "Error: AMLOGIC_URL is empty!"; exit 1; fi

        else
          # IPK mode (ImmortalWrt 24.10)
          AMLOGIC_URL=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/ophub/luci-app-amlogic/releases/latest | grep "browser_download_url" | grep "luci-app-amlogic_" | grep -v "i18n" | grep "\.ipk" | head -n 1 | cut -d '"' -f 4)
          if [ -n "$AMLOGIC_URL" ]; then curl -L -o packages/luci-app-amlogic.ipk "$AMLOGIC_URL"; else echo "Error: AMLOGIC_URL is empty!"; exit 1; fi

        fi
        
        echo "Building current HomeProxy and MosDNS packages with the matching SDK..."
        SDK_INDEX_URL="https://downloads.immortalwrt.org/releases/$VERSION_NUM/targets/armsr/armv8/"
        SDK_FILE=$(curl -fsSL "$SDK_INDEX_URL" | grep -oE 'immortalwrt-sdk-[^"]+Linux-x86_64\.tar\.zst' | grep "^immortalwrt-sdk-${VERSION_NUM}-armsr-armv8_" | head -n 1)
        if [ -z "$SDK_FILE" ]; then echo "Error: matching ImmortalWrt SDK not found"; exit 1; fi

        curl -fL "$SDK_INDEX_URL$SDK_FILE" -o "$GITHUB_WORKSPACE/$SDK_FILE"
        tar -xf "$GITHUB_WORKSPACE/$SDK_FILE" -C "$GITHUB_WORKSPACE"
        rm -f "$GITHUB_WORKSPACE/$SDK_FILE"
        SDK_DIR=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type d -name "immortalwrt-sdk-${VERSION_NUM}-armsr-armv8_*" -print -quit)
        if [ -z "$SDK_DIR" ]; then echo "Error: SDK extraction failed"; exit 1; fi

        cd "$SDK_DIR"
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        bash "$GITHUB_WORKSPACE/armsr/armv8/diy/add_n1_packages.sh"

        cat >> .config <<'EOF'
        CONFIG_PACKAGE_luci-app-homeproxy=y
        CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y
        CONFIG_PACKAGE_luci-app-mosdns=y
        CONFIG_PACKAGE_luci-i18n-mosdns-zh-cn=y
        CONFIG_PACKAGE_mosdns=y
        CONFIG_PACKAGE_geo2txt=y
        CONFIG_PACKAGE_v2ray-geoip=y
        CONFIG_PACKAGE_v2ray-geosite=y
        EOF
        make defconfig
        make -j"$(nproc)" \
          package/homeproxy/compile \
          package/mosdns/mosdns/compile \
          package/mosdns/geo2txt/compile \
          package/mosdns/luci-app-mosdns/compile \
          package/v2ray-geodata/compile

        for PACKAGE in luci-app-homeproxy luci-i18n-homeproxy-zh-cn luci-app-mosdns luci-i18n-mosdns-zh-cn mosdns v2ray-geoip v2ray-geosite geo2txt; do
          PACKAGE_COUNT=0
          while IFS= read -r -d '' PACKAGE_FILE; do
            cp "$PACKAGE_FILE" "$GITHUB_WORKSPACE/imagebuilder/packages/"
            PACKAGE_COUNT=$((PACKAGE_COUNT + 1))
          done < <(find "$SDK_DIR/bin/packages" -type f \( -name "$PACKAGE*.ipk" -o -name "$PACKAGE*.apk" \) -print0)
          if [ "$PACKAGE_COUNT" -eq 0 ]; then
            echo "Error: package $PACKAGE was not built by the SDK"
            exit 1
          fi
        done

        cd "$GITHUB_WORKSPACE/imagebuilder"

        echo "Copying custom configuration files..."
        cp -r $GITHUB_WORKSPACE/armsr/armv8/N1/files/* files/
        sed -i "s|https://github.com/nantayo/N1-OpenWrt|https://github.com/${{ github.repository }}|g" files/etc/config/amlogic
        
        echo "Building image..."
        PACKAGES="luci-app-amlogic luci-app-homeproxy luci-i18n-homeproxy-zh-cn luci-app-mosdns luci-i18n-mosdns-zh-cn autocore fstrim zoneinfo-asia bsdtar btrfs-progs chattr f2fs-tools gawk getopt lsattr perlbase-file perlbase-getopt perlbase-unicode perl-http-date pigz tar xfs-fsck xfs-mkfs -ppp -ppp-mod-pppoe -kmod-ppp -luci-app-attendedsysupgrade kmod-tun kmod-inet-diag kmod-netlink-diag kmod-nft-tproxy"
        make image PROFILE="generic" PACKAGES="$PACKAGES" FILES="files"
        
        echo "Moving output to expected workspace..."
        mkdir -p $GITHUB_WORKSPACE/openwrt/bin/targets/armsr/armv8
        cp bin/targets/armsr/armv8/*rootfs.tar.gz $GITHUB_WORKSPACE/openwrt/bin/targets/armsr/armv8/
        echo "FILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV

    - name: Clone source code
      if: github.event.inputs.build_mode == 'Compile'
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        echo "FILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV
    - name: Update & Install feeds
      if: github.event.inputs.build_mode == 'Compile'
      run: |
        chmod +x armsr/armv8/diy/diy.sh
        cd openwrt
        ./scripts/feeds update -a
        $GITHUB_WORKSPACE/armsr/armv8/diy/diy.sh
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Add current HomeProxy and MosDNS sources
      if: github.event.inputs.build_mode == 'Compile'
      run: |
        cd openwrt
        bash "$GITHUB_WORKSPACE/armsr/armv8/diy/add_n1_packages.sh"

    - name: Load N1 custom config
      if: github.event.inputs.build_mode == 'Compile'
      run: |
        rm -rf openwrt/files openwrt/.config
        mv armsr/armv8/N1/files armsr/armv8/N1/.config openwrt/
        sed -i "s|https://github.com/nantayo/N1-OpenWrt|https://github.com/${{ github.repository }}|g" openwrt/files/etc/config/amlogic

    - name: SSH connect to Actions
      uses: P3TERX/ssh2actions@main
      if: github.event.inputs.ssh == 'true' && github.event.inputs.build_mode == 'Compile'

    - name: Download package
      if: github.event.inputs.build_mode == 'Compile'
      working-directory: ./openwrt
      run: |
        make defconfig
        make download -j$(( $(nproc) * 2 ))
        find dl -size -1k -exec rm -f {} \;

    - name: Compile N1 firmware
      if: github.event.inputs.build_mode == 'Compile'
      run: |
        chmod -R 755 openwrt
        chmod 600 openwrt/files/etc/n1-root-password.hash
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(( $(nproc) + 1 )) || make -j1 V=s

    - name: Package N1 firmware
      uses: ophub/amlogic-s9xxx-openwrt@main
      with:
        openwrt_path: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
        openwrt_board: s905d
        kernel_repo: ophub/kernel
        kernel_usage: flippy
        openwrt_kernel: ${{ github.event.inputs.kernel || '6.12.y' }}
        builder_name: ${{ github.actor }}

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      with:
        tag_name: OpenWrt_${{ env.FILE_DATE }}
        files: ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
        body: |
          首次使用建议全新刷写
          * 基本信息
          IP: 192.168.0.240
          账户: root
          密码: 已通过 GitHub Actions secret N1_ROOT_PASSWORD 设置

    - name: Delete old releases
      uses: mgz0227/delete-older-releases@master
      with:
        keep_latest: 2
        delete_tags : true
