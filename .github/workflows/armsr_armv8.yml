name: Build ImmortalWrt for armsr_armv8

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'ImmortalWrt Branch or Tag'
        required: true
        default: 'v25.12.2'
        type: choice
        options:
          - v25.12.0
          - v25.12.1
          - v25.12.2
      kernel:
        description: 'Amlogic Kernel Version'
        required: true
        default: '6.12.y'
        type: choice
        options:
          - 6.12.y
          - 6.6.y
          - 6.1.y
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Free up space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update > /dev/null
        sudo -E apt-get -qq install -y $(curl -fsSL https://raw.githubusercontent.com/nantayo/My-Pkg/master/openwrt) > /dev/null
        sudo -E apt-get -qq autoremove --purge > /dev/null
        sudo -E apt-get -qq clean > /dev/null
        sudo timedatectl set-timezone "$TZ"

    - name: Prepare first-boot root password
      env:
        N1_ROOT_PASSWORD: ${{ secrets.N1_ROOT_PASSWORD }}
      run: |
        if [[ -z "$N1_ROOT_PASSWORD" ]]; then
          echo "Set the N1_ROOT_PASSWORD Actions secret before building."
          exit 1
        fi

        ROOT_PASSWORD_HASH=$(printf '%s\n' "$N1_ROOT_PASSWORD" | openssl passwd -6 -stdin)
        if [[ -z "$ROOT_PASSWORD_HASH" ]]; then
          echo "Failed to hash N1_ROOT_PASSWORD."
          exit 1
        fi

        mkdir -p armsr/armv8/N1/files/etc/uci-defaults
        printf '%s\n' "$ROOT_PASSWORD_HASH" > armsr/armv8/N1/files/etc/n1-root-password.hash
        chmod 600 armsr/armv8/N1/files/etc/n1-root-password.hash
        cat > armsr/armv8/N1/files/etc/uci-defaults/zzzz-n1-root-password <<'EOF'
        #!/bin/sh
        umask 077
        hash="$(cat /etc/n1-root-password.hash 2>/dev/null)"
        [ -n "$hash" ] || exit 1
        awk -F: -v hash="$hash" 'BEGIN { OFS = FS } $1 == "root" { $2 = hash } { print }' /etc/shadow > /etc/shadow.tmp || exit 1
        mv /etc/shadow.tmp /etc/shadow || exit 1
        rm -f /etc/n1-root-password.hash
        exit 0
        EOF
        chmod 700 armsr/armv8/N1/files/etc/uci-defaults/zzzz-n1-root-password

    - name: Use Image Builder to build rootfs
      run: |
        VERSION_NUM=$(echo "${{ github.event.inputs.branch || 'v25.12.2' }}" | sed 's/^v//')
        IB_FILE="immortalwrt-imagebuilder-${VERSION_NUM}-armsr-armv8.Linux-x86_64.tar.zst"
        IB_URL="https://downloads.immortalwrt.org/releases/${VERSION_NUM}/targets/armsr/armv8/${IB_FILE}"
        
        echo "Downloading Image Builder from $IB_URL..."
        curl -LO "$IB_URL"
        tar -xf "$IB_FILE"
        rm -f "$IB_FILE"
        mv immortalwrt-imagebuilder-* imagebuilder
        
        cd imagebuilder
        mkdir -p packages files

        echo "Downloading prebuilt packages from the latest releases..."
        RELEASE_DIR="$RUNNER_TEMP/release-packages"
        AMLOGIC_APP=$(bash "$GITHUB_WORKSPACE/armsr/armv8/diy/download_release_asset.sh" \
          ophub/luci-app-amlogic 'luci-app-amlogic-' '.apk' "$RELEASE_DIR/amlogic")
        AMLOGIC_I18N=$(bash "$GITHUB_WORKSPACE/armsr/armv8/diy/download_release_asset.sh" \
          ophub/luci-app-amlogic 'luci-i18n-amlogic-zh-cn-' '.apk' "$RELEASE_DIR/amlogic")
        HOMEPROXY_PACKAGE=$(bash "$GITHUB_WORKSPACE/armsr/armv8/diy/download_release_asset.sh" \
          getSomeCats/homeproxy 'luci-app-homeproxy_' '_all.apk' "$RELEASE_DIR/homeproxy")
        MOSDNS_ARCHIVE=$(bash "$GITHUB_WORKSPACE/armsr/armv8/diy/download_release_asset.sh" \
          sbwml/luci-app-mosdns 'aarch64_generic-' 'openwrt-25.12.tar.gz' "$RELEASE_DIR/mosdns")
        SING_BOX_PACKAGE=$(bash "$GITHUB_WORKSPACE/armsr/armv8/diy/download_release_asset.sh" \
          SagerNet/sing-box 'sing-box_' '_openwrt_aarch64_generic.apk' "$RELEASE_DIR/sing-box")

        HOMEPROXY_ASSET_NAME=$(basename "$HOMEPROXY_PACKAGE")
        if [[ "$HOMEPROXY_ASSET_NAME" =~ ^luci-app-homeproxy_(.+)_all\.apk$ ]]; then
          HOMEPROXY_VERSION="${BASH_REMATCH[1]}"
        else
          echo "Error: unexpected HomeProxy release asset name: $HOMEPROXY_ASSET_NAME"
          exit 1
        fi

        cp "$AMLOGIC_APP" "$AMLOGIC_I18N" packages/
        cp "$HOMEPROXY_PACKAGE" "packages/luci-app-homeproxy-${HOMEPROXY_VERSION}.apk"

        MOSDNS_EXTRACT_DIR="$RUNNER_TEMP/mosdns-packages"
        mkdir -p "$MOSDNS_EXTRACT_DIR"
        tar -xzf "$MOSDNS_ARCHIVE" -C "$MOSDNS_EXTRACT_DIR"
        MOSDNS_PACKAGE_DIR="$MOSDNS_EXTRACT_DIR/packages_ci"
        if [[ ! -d "$MOSDNS_PACKAGE_DIR" ]]; then echo "Error: MosDNS release archive has no packages_ci directory"; exit 1; fi
        for PACKAGE in geo2txt v2ray-geoip v2ray-geosite mosdns luci-app-mosdns luci-i18n-mosdns-zh-cn; do
          PACKAGE_FILE=$(find "$MOSDNS_PACKAGE_DIR" -maxdepth 1 -type f -name "$PACKAGE-*.apk" -print -quit)
          if [[ -z "$PACKAGE_FILE" ]]; then echo "Error: MosDNS release is missing package $PACKAGE"; exit 1; fi
          cp "$PACKAGE_FILE" packages/
        done

        echo "Copying custom configuration files..."
        cp -r $GITHUB_WORKSPACE/armsr/armv8/N1/files/* files/
        sed -i "s|https://github.com/nantayo/N1-OpenWrt|https://github.com/${{ github.repository }}|g" files/etc/config/amlogic
        
        echo "Building image..."
        PACKAGES="luci-app-amlogic luci-i18n-amlogic-zh-cn luci-app-homeproxy luci-app-mosdns luci-i18n-mosdns-zh-cn luci-i18n-package-manager-zh-cn luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn autocore fstrim zoneinfo-asia bsdtar btrfs-progs chattr f2fs-tools gawk getopt lsattr perlbase-file perlbase-getopt perlbase-unicode perl-http-date pigz tar xfs-fsck xfs-mkfs -ppp -ppp-mod-pppoe -kmod-ppp -luci-app-attendedsysupgrade kmod-tun kmod-inet-diag kmod-netlink-diag kmod-nft-tproxy kmod-nft-queue"
        make image PROFILE="generic" PACKAGES="$PACKAGES" FILES="files"
        
        echo "Moving output to expected workspace..."
        mkdir -p $GITHUB_WORKSPACE/openwrt/bin/targets/armsr/armv8
        cp bin/targets/armsr/armv8/*rootfs.tar.gz $GITHUB_WORKSPACE/openwrt/bin/targets/armsr/armv8/
        SING_BOX_MANAGER="$PWD/staging_dir/host/bin/apk"
        for ROOTFS_ARCHIVE in "$GITHUB_WORKSPACE"/openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz; do
          # HomeProxy's dependency installs sing-box first; replace it with the official release package afterwards.
          bash "$GITHUB_WORKSPACE/armsr/armv8/diy/install_sing_box_release.sh" "$ROOTFS_ARCHIVE" "$SING_BOX_PACKAGE" "$SING_BOX_MANAGER"
        done
        echo "FILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV

    - name: Package N1 firmware
      uses: ophub/amlogic-s9xxx-openwrt@main
      with:
        openwrt_path: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
        openwrt_board: s905d
        kernel_repo: ophub/kernel
        kernel_usage: flippy
        openwrt_kernel: ${{ github.event.inputs.kernel || '6.12.y' }}
        builder_name: ${{ github.actor }}

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      with:
        tag_name: OpenWrt_${{ env.FILE_DATE }}
        files: ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
        body: |
          首次使用建议全新刷写
          * 基本信息
          IP: 192.168.0.240
          账户: root
          密码: 已通过 GitHub Actions secret N1_ROOT_PASSWORD 设置

    - name: Delete old releases
      uses: mgz0227/delete-older-releases@master
      with:
        keep_latest: 2
        delete_tags : true
